name: Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopy_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run lint
        run: yarn lint

      - name: Audit runtime and development dependencies
        run: yarn audit --json

      - name: Run build
        run: yarn build

      - name: Run tests
        run: yarn test --runInBand
        env:
          NODE_ENV: test
          REDIS_URL: redis://localhost:6379

      - name: Verify SQL transactions and database roles in memory
        run: yarn test:db

      - name: Verify transactions with independent PostgreSQL connections
        run: yarn test:db:concurrency
        env:
          LOOPY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/loopy_test_ci
          LOOPY_DISPOSABLE_DATABASE: 'true'

      - name: Verify migration plan without connecting to a database
        run: yarn migrate
